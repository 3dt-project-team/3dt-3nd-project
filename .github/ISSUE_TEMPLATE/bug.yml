name: "Bug"
description: 버그 신고 및 수정 요청
title: "fix(scope): "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: 어떤 문제가 발생했는지 설명해주세요.
      placeholder: 예) vault_manager.get_pg_connection() 호출 시 ConnectionError 발생
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: 정상적으로 동작해야 하는 방식은 무엇인가요?
      placeholder: 예) psycopg 연결 객체가 정상 반환되어야 함
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: 재현 방법
      placeholder: |
        1. uv sync 실행
        2. uv run python src/utils/vault_manager.py 실행
        3. ConnectionError 발생
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: 환경 정보 (OS, Python 버전 등)
      placeholder: |
        - OS: Windows 11
        - Python: 3.11.15
        - uv: 0.6.x
    validations:
      required: false
