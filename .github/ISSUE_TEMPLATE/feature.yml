name: "Feature"
description: 기능 개발 또는 개선 작업
title: "feat(scope): "
labels: ["feature"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: 무엇을 개발/변경하는지 간단히 작성해주세요.
      placeholder: 예) EventHub 트리거 핸들러를 추가하여 실시간 이벤트 처리
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: 구체적인 작업 목록 (체크리스트)
      placeholder: |
        - [ ] src/functions/eventhub.py 트리거 핸들러 구현
        - [ ] pyproject.toml 의존성 추가
        - [ ] 로컬 테스트
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: 참고 사항, 관련 문서, 의존성 이슈 등
      placeholder: 관련 PR / 링크 / 주의사항
    validations:
      required: false
