# pre-commit 설정 — 커밋 전 자동 검사
# 설치: uv run pre-commit install && uv run pre-commit install --hook-type commit-msg
# 전체 실행: uv run pre-commit run --all-files
# 자세한 설명: docs/git_guide/git_guide_workflow/05_precommit_setup.md

repos:
  # ──────────────────────────────────────────────
  # ruff: 린트 + import 정렬 + 포맷 (Rust 기반)
  # ──────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ──────────────────────────────────────────────
  # detect-secrets: 하드코딩된 시크릿 감지
  # ──────────────────────────────────────────────
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
